<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TermiNotes | Classe</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#8b5cf6', 600: '#7c3aed' } } } }
        }
    </script>
</head>
<body class="bg-[#0b1120] text-slate-200 font-sans min-h-screen flex flex-col">

    <!-- MODALE CONNEXION -->
    <div id="authModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[100] flex items-center justify-center">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-brand-600 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-astronaut text-2xl text-white"></i>
                </div>
                <h2 class="text-xl font-bold text-white">Rejoindre la classe</h2>
            </div>
            <div class="space-y-4">
                <input type="text" id="setupName" placeholder="Ton prénom..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                <button id="btnSaveProfile" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 rounded-xl transition">
                    Entrer dans TermiNotes
                </button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 rounded-lg bg-brand-600 flex items-center justify-center">
                    <i class="fa-solid fa-layer-group text-white text-sm"></i>
                </div>
                <span class="text-xl font-bold text-white">Termi<span class="text-brand-400">Notes</span></span>
            </div>
            <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 py-1.5 px-3 rounded-lg">
                <i class="fa-solid fa-user-circle text-slate-400"></i>
                <span id="displayUserName" class="text-sm font-medium text-white">Anonyme</span>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- PUBLICATION (7 cols) -->
        <section class="lg:col-span-7 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-cloud-arrow-up text-brand-400 mr-2"></i>Partager un cours</h2>

                <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-brand-500 bg-slate-950/50 rounded-xl p-6 text-center cursor-pointer relative">
                    <input type="file" id="fileInput" accept="image/*,.txt" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <i class="fa-solid fa-camera text-3xl text-slate-500 mb-2"></i>
                    <p class="text-sm text-slate-300">Glisse une photo ou clique pour ajouter un cours</p>
                    <p id="ocrStatus" class="text-xs text-brand-400 mt-2 hidden"></p>
                </div>

                <div class="mt-4 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Matière</label>
                        <select id="subject" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                            <option value="Philosophie">🧠 Philosophie</option>
                            <option value="Mathématiques">📐 Mathématiques</option>
                            <option value="HGGSP">🌍 HGGSP</option>
                            <option value="SVT">🧬 SVT</option>
                            <option value="Physique-Chimie">🧪 Physique-Chimie</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Contenu texte</label>
                        <textarea id="courseContent" rows="6" placeholder="Extrait OCR ou cours écrit..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 resize-none"></textarea>
                    </div>
                    <button id="btnPublish" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 rounded-xl transition">
                        Publier sur le réseau
                    </button>
                </div>
            </div>
        </section>

        <!-- FLUX & IA (5 cols) -->
        <section class="lg:col-span-5 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-wand-magic-sparkles text-amber-400 mr-2"></i>Fiche Express IA</h2>
                    <button id="btnAI" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-amber-500/20">
                        Générer
                    </button>
                </div>
                <div id="aiOutput" class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-slate-400 min-h-[120px] max-h-[250px] overflow-y-auto">
                    Clique sur Générer pour synthétiser le dernier cours.
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-rss text-emerald-400 mr-2"></i>Flux de la classe</h2>
                <div id="feedList" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                    <p class="text-xs text-slate-500 text-center py-4">Chargement...</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        // ==========================================
        // VOS CLÉS À REMPLIR ICI
        // ==========================================
        const JSONBIN_BIN_ID = 'TON_BIN_ID';         
        const JSONBIN_API_KEY = 'TA_SECRET_KEY';     
        const GROQ_API_KEY     = 'TA_CLE_GROQ';       

        let currentUser = "";
        let classData = [];

        // --- GESTION DU PROFIL ---
        function saveProfile() {
            const name = document.getElementById('setupName').value.trim();
            if (name.length < 2) return alert("Rentre un prénom valide !");
            localStorage.setItem('terminotes_user', name);
            currentUser = name;
            document.getElementById('displayUserName').innerText = currentUser;
            document.getElementById('authModal').classList.add('hidden');
            loadFeed();
        }

        function initApp() {
            currentUser = localStorage.getItem('terminotes_user');
            if (currentUser) {
                document.getElementById('displayUserName').innerText = currentUser;
                document.getElementById('authModal').classList.add('hidden');
                loadFeed();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
            }

            // Écouteurs d'événements
            document.getElementById('btnSaveProfile').onclick = saveProfile;
            document.getElementById('btnPublish').onclick = publishCourse;
            document.getElementById('btnAI').onclick = generateAI;
            document.getElementById('fileInput').onchange = handleFileUpload;
        }

        // --- BDD : CHARGEMENT DU FLUX ---
        async function loadFeed() {
            const feed = document.getElementById('feedList');
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const data = await res.json();
                
                // Gestion de la structure de données JSONBin
                if (data.record && Array.isArray(data.record.cours)) {
                    classData = data.record.cours;
                } else if (Array.isArray(data.record)) {
                    classData = data.record;
                } else {
                    classData = [];
                }

                feed.innerHTML = '';
                if (classData.length === 0) {
                    feed.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Aucun cours publié.</p>';
                    return;
                }

                classData.slice().reverse().forEach(item => {
                    feed.innerHTML += `
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-bold text-brand-400">${item.user || 'Anonyme'}</span>
                                <span class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded text-[10px]">${item.subject || 'Général'}</span>
                            </div>
                            <p class="text-xs text-slate-300 break-words">${item.content}</p>
                        </div>`;
                });
            } catch (err) {
                feed.innerHTML = '<p class="text-xs text-red-400 text-center py-4">Erreur de chargement JSONBin.</p>';
            }
        }

        // --- BDD : PUBLICATION ---
        async function publishCourse() {
            const subject = document.getElementById('subject').value;
            const content = document.getElementById('courseContent').value.trim();
            if (!content) return alert("Le contenu est vide !");

            const btn = document.getElementById('btnPublish');
            btn.innerText = "Publication...";
            btn.disabled = true;

            classData.push({ user: currentUser, subject, content, date: new Date().toISOString() });

            try {
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify({ cours: classData })
                });

                document.getElementById('courseContent').value = '';
                loadFeed();
            } catch (err) {
                alert("Erreur lors de la publication.");
            } finally {
                btn.innerText = "Publier sur le réseau";
                btn.disabled = false;
            }
        }

        // --- IA GENERATION ---
        async function generateAI() {
            if (classData.length === 0) return alert("Aucun cours disponible pour l'IA.");
            const lastCourse = classData[classData.length - 1].content;
            const output = document.getElementById('aiOutput');
            output.innerText = "Génération de la fiche...";

            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Authorization': 'Bearer ' + GROQ_API_KEY, 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: "Fais une fiche de révision courte et structurée en Markdown." },
                            { role: "user", content: lastCourse }
                        ]
                    })
                });

                const data = await res.json();
                if (data.choices && data.choices[0]) {
                    output.innerHTML = marked.parse(data.choices[0].message.content);
                } else {
                    output.innerText = "Erreur réponse IA (Vérifie ta clé GROQ).";
                }
            } catch (err) {
                output.innerText = "Erreur IA.";
            }
        }

        // --- OCR / UPLOAD ---
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const status = document.getElementById('ocrStatus');

            if (file.type === "text/plain") {
                document.getElementById('courseContent').value = await file.text();
                return;
            }

            status.classList.remove('hidden');
            status.innerText = "Lecture de l'image...";

            try {
                const worker = await Tesseract.createWorker('fra');
                const ret = await worker.recognize(file);
                document.getElementById('courseContent').value = ret.data.text;
                await worker.terminate();
                status.innerText = "Texte extrait !";
            } catch (err) {
                status.innerText = "Erreur d'analyse d'image.";
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
