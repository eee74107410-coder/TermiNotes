<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TermiNotes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Tesseract.js pour l'OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-layer-group text-white text-lg"></i>
                </div>
                <span class="text-xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">TermiNotes</span>
            </div>
            <div id="statusBadge" class="text-xs bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-full flex items-center gap-2 text-slate-400">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                Connexion...
            </div>
        </div>
    </header>

    <!-- App Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Scanner & Input (7 cols) -->
        <section class="lg:col-span-7 space-y-6">
            
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm relative overflow-hidden shadow-xl">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
                
                <h2 class="text-lg font-bold flex items-center gap-2 text-white mb-4">
                    <i class="fa-solid fa-camera text-indigo-400"></i> Numeriser un cours
                </h2>

                <!-- Zone Drag & Drop -->
                <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-indigo-500/50 rounded-xl p-6 text-center transition cursor-pointer bg-slate-950/40 group">
                    <input type="file" id="fileInput" accept="image/*,.txt" class="hidden">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-500 group-hover:text-indigo-400 group-hover:scale-110 transition mb-2"></i>
                    <p class="text-sm text-slate-300 font-medium">Glisse une photo de ton cahier ici ou <span class="text-indigo-400 underline">parcours</span></p>
                    <p class="text-xs text-slate-500 mt-1">Formats acceptés : PNG, JPG, WEBP, TXT</p>
                </div>

                <!-- Progression OCR -->
                <div id="ocrProgress" class="hidden mt-4 space-y-2">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span id="ocrStatus">Lecture de l'image...</span>
                        <span id="ocrPercent">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="ocrBar" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>

                <!-- Formulaire -->
                <div class="mt-6 space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Prénom</label>
                            <input type="text" id="studentName" placeholder="Ton prénom" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Matière</label>
                            <select id="subject" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 transition">
                                <option value="Philo">Philosophie</option>
                                <option value="Maths">Mathématiques</option>
                                <option value="HGGSP">HGGSP</option>
                                <option value="SVT">SVT</option>
                                <option value="Physique">Physique-Chimie</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Contenu texte (extrait de l'image ou manuscrit)</label>
                        <textarea id="courseContent" rows="6" placeholder="Le texte apparaîtra ici après le scan..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
                    </div>
                    <button onclick="addContribution()" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-2.5 rounded-lg transition shadow-lg shadow-indigo-600/20 text-sm">
                        Publier sur le réseau (+10 pts)
                    </button>
                </div>
            </div>

        </section>

        <!-- Right Column: Studio IA & Feed (5 cols) -->
        <section class="lg:col-span-5 space-y-6">
            
            <!-- Studio Fiche IA -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm shadow-xl space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold flex items-center gap-2 text-white">
                        <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> Fiche Synthèse IA
                    </h2>
                    <button onclick="generateFiche()" id="btnAI" class="bg-purple-600 hover:bg-purple-500 text-xs font-semibold px-3 py-2 rounded-lg transition">
                        Générer
                    </button>
                </div>
                <div id="aiOutput" class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-slate-300 min-h-[200px] max-h-[300px] overflow-y-auto prose prose-invert">
                    Clique sur Générer pour synthétiser le dernier cours avec Llama 3.
                </div>
            </div>

            <!-- Feed -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm shadow-xl space-y-4">
                <h2 class="text-lg font-bold flex items-center gap-2 text-white">
                    <i class="fa-solid fa-rss text-emerald-400"></i> Flux des cours
                </h2>
                <div id="feedList" class="space-y-3 max-h-[300px] overflow-y-auto pr-1">
                    <!-- Injection dynamique -->
                </div>
            </div>

        </section>

    </main>

    <!-- Application Script -->
    <script>
        const SUPABASE_URL = 'https://talfwufmazofhlarqisr.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_PwGbY_fAAjM3gyEGUxIrDg_77GrP-dW';
        const GROQ_API_KEY = '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';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let lastCourseContent = "";

        // Gestion Drag & Drop / File Input
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-indigo-500'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500');
            if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if(e.target.files.length) handleFile(e.target.files[0]); });

        async function handleFile(file) {
            if (file.type === "text/plain") {
                const text = await file.text();
                document.getElementById('courseContent').value = text;
                return;
            }

            if (!file.type.startsWith('image/')) {
                alert("Format non pris en charge.");
                return;
            }

            const progressBox = document.getElementById('ocrProgress');
            const status = document.getElementById('ocrStatus');
            const percent = document.getElementById('ocrPercent');
            const bar = document.getElementById('ocrBar');

            progressBox.classList.remove('hidden');

            try {
                const worker = await Tesseract.createWorker('fra');
                const ret = await worker.recognize(file);
                document.getElementById('courseContent').value = ret.data.text;
                await worker.terminate();
            } catch (err) {
                alert("Erreur lors de la lecture d'image : " + err.message);
            } finally {
                progressBox.classList.add('hidden');
            }
        }

        async function loadContributions() {
            const feed = document.getElementById('feedList');
            const badge = document.getElementById('statusBadge');
            try {
                const { data, error } = await supabase.from('contributions').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Connecté`;
                feed.innerHTML = '';

                if (data.length > 0) {
                    lastCourseContent = data[0].content;
                    data.forEach(item => {
                        feed.innerHTML += `
                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                                <div class="flex justify-between items-center text-xs">
                                    <span class="font-bold text-indigo-400">${item.student_name}</span>
                                    <span class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded">${item.subject}</span>
                                </div>
                                <p class="text-xs text-slate-300 line-clamp-2">${item.content}</p>
                            </div>`;
                    });
                } else {
                    feed.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Aucun cours publié.</p>`;
                }
            } catch (err) {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> Erreur Supabase`;
            }
        }

        async function addContribution() {
            const name = document.getElementById('studentName').value.trim();
            const subject = document.getElementById('subject').value;
            const content = document.getElementById('courseContent').value.trim();

            if (!name || !content) return alert("Remplis ton prénom et le contenu du cours !");

            const { error } = await supabase.from('contributions').insert([{ student_name: name, subject, content, points: 10 }]);
            if (error) {
                alert("Erreur de publication : " + error.message);
            } else {
                document.getElementById('courseContent').value = '';
                loadContributions();
            }
        }

        async function generateFiche() {
            if (!lastCourseContent) return alert("Aucun cours à analyser.");
            const output = document.getElementById('aiOutput');
            output.innerHTML = "Génération de la fiche en cours...";

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: "Fais une fiche de révision synthétique en Markdown avec titres et puces." },
                            { role: "user", content: lastCourseContent }
                        ]
                    })
                });
                const data = await response.json();
                output.innerHTML = marked.parse(data.choices[0].message.content);
            } catch (err) {
                output.innerHTML = "Erreur de génération IA : " + err.message;
            }
        }

        document.addEventListener('DOMContentLoaded', loadContributions);
    </script>
</body>
</html>
